<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockSense — Inventory Management</title>
  <meta name="description" content="StockSense inventory management system" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <div class="brand-logo"><span>▦</span></div>
        <div class="brand-text">
          <h1>StockSense</h1>
          <span>INVENTORY MANAGEMENT</span>
        </div>
      </div>

      <nav class="navigation" id="navigation">
        <p class="section-label">MENU</p>
        <!-- nav items injected by app.js -->
      </nav>

      <div class="sidebar-bottom">
        <div class="system-status">
          <span class="status-indicator" id="apiStatusDot"></span>
          <div>
            <strong id="apiStatusText">Connecting…</strong>
            <small>Backend · localhost:5000</small>
          </div>
        </div>

        <div class="user-profile">
          <div class="avatar">AD</div>
          <div class="user-info">
            <strong>Admin</strong>
            <small>Inventory Manager</small>
          </div>
        </div>
      </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>

        <div class="page-heading">
          <span id="pageEyebrow">OVERVIEW</span>
          <h2 id="pageTitle">Dashboard</h2>
        </div>

        <div class="topbar-actions">
          <button class="icon-button" id="refreshButton" title="Refresh data">⟳</button>
        </div>
      </header>

      <section class="content" id="pageRoot">
        <!-- page content injected by app.js -->
      </section>

      <footer>
        <span>StockSense · Hackathon Build</span>
        <span id="footerStatus">● connecting…</span>
      </footer>

    </main>

  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
